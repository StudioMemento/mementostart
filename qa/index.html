<!doctype html><html lang="it"><meta charset="utf-8"><title>Memento VFX — QA</title><style>body{margin:0;background:#292929;color:#fff;font:13px system-ui}header{position:sticky;top:0;padding:9px;display:flex;gap:8px;background:#222;z-index:3;flex-wrap:wrap}button,input,select{font:inherit;padding:5px}iframe{display:block;border:0;margin:0 auto;height:900px;background:#121212}output{font:11px monospace;white-space:pre-wrap;display:block;padding:12px}</style>
<header><select id="width"><option>1440</option><option>1024</option><option>768</option><option>390</option><option>360</option></select><button id="reset">Load</button><button id="off">FX on/off</button><button id="scroll">Scroll giù / su</button><button id="cursor">Cursor 15 s</button><button id="stop">Stop</button><select id="frame"><option value="">Intro live</option><option>0</option><option>120</option><option>280</option><option>520</option><option>820</option><option>1050</option></select><button id="gutter">Gutter</button><button id="faq">FAQ</button><button id="end">Fine pagina</button><button id="reduced">Fallback statico</button><button id="destroy">Cleanup</button></header>
<div style="padding:8px;display:flex;gap:8px"><button id="sw">Hero S/W</button><button id="get">Hero G/E/T</button><button id="photo">Centro foto</button><button id="leave">Quiete</button><label>Altezza <select id="height"><option>900</option><option>600</option><option>480</option></select></label></div><iframe id="view" title="Start responsive QA"></iframe><output id="result"></output>
<script>
const view=document.getElementById('view'),result=document.getElementById('result');let off=false,timer=0,run=0;
function load(extra=''){clearInterval(timer);cancelAnimationFrame(run);view.style.width=document.getElementById('width').value+'px';view.style.maxWidth='none';view.src='../?fxdebug=1'+(off?'&fx=off':'')+extra;}
document.getElementById('reset').onclick=()=>load();document.getElementById('width').onchange=()=>{view.style.width=document.getElementById('width').value+'px';};document.getElementById('frame').onchange=e=>{view.contentWindow.scrollTo({top:0,behavior:'instant'});view.contentWindow.MementoVFX?.setIntroFrame(e.target.value===''?null:+e.target.value);};document.getElementById('off').onclick=()=>{off=!off;view.contentWindow.MementoVFX?.setEnabled(!off);};
const report=()=>{const w=view.contentWindow,s=w.MementoVFX?.state;const maskMismatches=[...w.document.querySelectorAll('[data-mm-mask]')].filter(n=>n.style.maskImage).flatMap(n=>{const id=n.style.maskImage.match(/#([^"\)]+)/)?.[1],m=w.document.getElementById(id),r=n.getBoundingClientRect();return m&&(Math.abs(+m.getAttribute('width')-4-r.width)>1||Math.abs(+m.getAttribute('height')-4-r.height)>1)?[n.id||n.className]:[];});result.textContent=JSON.stringify({width:w.innerWidth,scroll:w.scrollY,maskMismatches,disabled:s?.disabled,intro:s?.intro,pointer:s?.pointer,overflow:w.document.documentElement.scrollWidth>w.innerWidth,svg:w.document.querySelectorAll('.mm-vfx-overlay,.mm-vfx-nav-overlay').length,masks:w.document.querySelectorAll('[data-mm-mask][style*=mask-image]').length,metrics:w.document.getElementById('mm-fx-metrics')?.textContent,engine:!!s},null,2);};
view.onload=()=>{view.contentWindow.document.querySelectorAll('img').forEach(n=>n.loading='eager');clearInterval(timer);timer=setInterval(report,400);};
document.getElementById('gutter').onclick=()=>{const w=view.contentWindow,a=w.document.getElementById('mm-email-project').getBoundingClientRect();w.scrollTo({top:w.scrollY+a.bottom-430,behavior:'instant'});const r=w.document.getElementById('mm-email-project').getBoundingClientRect();w.document.dispatchEvent(new w.PointerEvent('pointermove',{isPrimary:true,clientX:r.right+8,clientY:r.bottom+8,pointerType:'mouse',bubbles:true}));};
document.getElementById('faq').onclick=()=>{const w=view.contentWindow;w.document.getElementById('faq').scrollIntoView();};
document.getElementById('end').onclick=()=>view.contentWindow.scrollTo(0,99999);
document.getElementById('reduced').onclick=()=>{view.contentWindow.MementoVFX?.setEnabled(false);report();};
document.getElementById('destroy').onclick=()=>{view.contentWindow.MementoVFX?.destroy();report();};
document.getElementById('stop').onclick=()=>cancelAnimationFrame(run);
document.getElementById('height').onchange=e=>view.style.height=e.target.value+'px';
function point(node,x=.5,y=.5){const w=view.contentWindow,r=node.getBoundingClientRect();w.document.dispatchEvent(new w.PointerEvent('pointermove',{isPrimary:true,clientX:r.left+r.width*x,clientY:r.top+r.height*y,pointerType:'mouse',bubbles:true}));}
document.getElementById('sw').onclick=()=>{const w=view.contentWindow;w.scrollTo({top:0,behavior:'instant'});point(w.document.querySelector('.hero-line'),.48,.68);};
document.getElementById('get').onclick=()=>{const w=view.contentWindow;w.scrollTo({top:0,behavior:'instant'});point(w.document.querySelectorAll('.hero-line')[1],.46,.5);};
document.getElementById('photo').onclick=()=>{const w=view.contentWindow,n=w.document.getElementById('mm-email-project');w.scrollTo({top:w.scrollY+n.getBoundingClientRect().top-260,behavior:'instant'});point(n,.65,.35);};
document.getElementById('leave').onclick=()=>{const w=view.contentWindow;w.document.dispatchEvent(new w.PointerEvent('pointerout',{relatedTarget:null}));};
document.getElementById('cursor').onclick=()=>{const w=view.contentWindow,t0=performance.now();w.MementoVFX?.resetMetrics();function next(t){const elapsed=t-t0;w.document.dispatchEvent(new w.PointerEvent('pointermove',{isPrimary:true,clientX:w.innerWidth*(.5+.30*Math.sin(elapsed/470)),clientY:340+170*Math.sin(elapsed/730),pointerType:'mouse',bubbles:true}));if(elapsed<15000)run=requestAnimationFrame(next);else{w.document.dispatchEvent(new w.PointerEvent('pointerout',{relatedTarget:null}));report();}}run=requestAnimationFrame(next);};
document.getElementById('scroll').onclick=()=>{const w=view.contentWindow,t0=performance.now(),max=w.document.documentElement.scrollHeight-w.innerHeight;w.MementoVFX?.resetMetrics();function next(t){const p=Math.min(1,(t-t0)/10000);w.scrollTo({top:(.5-.5*Math.cos(p*Math.PI*2))*max,behavior:'instant'});if(p<1)run=requestAnimationFrame(next);else report();}run=requestAnimationFrame(next);};load();
</script></html>
