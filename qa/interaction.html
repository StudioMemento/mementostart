<!doctype html><meta charset="utf-8"><title>Start V10 QA</title><style>body{margin:0;background:#222;color:white;font:13px monospace}header{height:46px;display:flex;gap:8px;align-items:center}button{padding:7px}iframe{border:0;display:block;width:1280px;height:900px}pre{white-space:pre-wrap}input{width:65px}</style><header><button id="desktop">Desktop</button><button id="mobile">Mobile</button><button id="home">Top</button><button id="scroll">Contacts</button><button id="hover">Hover email</button><button id="idle">Idle</button><button id="tests">Run checks</button><input id="amount" value="1500"><button id="go">Scroll</button></header><iframe id="app" src="/index.html"></iframe><pre id="results"></pre><script>
const app=document.querySelector('#app'),results=document.querySelector('#results');const win=()=>app.contentWindow,doc=()=>app.contentDocument;const wait=ms=>new Promise(r=>setTimeout(r,ms));const frames=()=>new Promise(r=>win().requestAnimationFrame(()=>win().requestAnimationFrame(r)));
function scroll(y){win().scrollTo({top:y,behavior:'instant'})}function ptr(x,y,type='pointermove',pt='mouse'){(doc().elementFromPoint(x,y)||doc().documentElement).dispatchEvent(new (win().PointerEvent)(type,{clientX:x,clientY:y,pointerId:7,pointerType:pt,isPrimary:true,bubbles:true}))}
desktop.onclick=()=>{app.style.width='1280px';app.style.height='900px'};mobile.onclick=()=>{app.style.width='390px';app.style.height='844px'};home.onclick=()=>scroll(0);document.querySelector('#scroll').onclick=()=>scroll(doc().querySelector('#contatti').offsetTop-200);hover.onclick=()=>{let r=doc().querySelector('#mm-email-studio')?.getBoundingClientRect()||doc().querySelector('.email-card').getBoundingClientRect();ptr(r.x+r.width*.65,r.y+r.height*.8)};idle.onclick=()=>ptr(-1000,-1000,'pointerleave');go.onclick=()=>scroll(+amount.value);
tests.onclick=async()=>{results.textContent="Running…";const checks=[];const check=(name,pass,info)=>checks.push({name,pass,info});scroll(0);ptr(-1000,-1000,'pointerleave');await wait(2300);const w=win(),d=doc();check('no horizontal overflow',d.documentElement.scrollWidth<=w.innerWidth,{actual:d.documentElement.scrollWidth,width:w.innerWidth});check('two decorative fixed canvases',d.querySelectorAll('canvas.memento-vfx-canvas').length===2&&[...d.querySelectorAll('canvas.memento-vfx-canvas')].every(e=>w.getComputedStyle(e).position==='fixed'));check('headings neutral',!w.getComputedStyle(d.querySelector('.hero-title')).backgroundImage.includes('201, 139'));check('all images loaded',[...d.querySelectorAll('main img')].every(e=>e.complete&&e.naturalWidth>0));const c=d.querySelector('.email-card');scroll(c.offsetTop-250);await wait(400);let r=c.getBoundingClientRect();ptr(r.x+r.width*.55,r.y+r.height*.7);await wait(800);check('active image exclusively',c.style.getPropertyValue('--vfx-image')==='1'&&[...d.querySelectorAll('.email-card,.channel')].filter(e=>e.style.getPropertyValue('--vfx-image')==='1').length===1);ptr(-1000,-1000,'pointerleave');await wait(900);check('idle image resets',c.style.getPropertyValue('--vfx-image')!=='1');let m0=w.MementoStartVFX.getMetrics();ptr(50,350,'pointerdown','touch');ptr(100,360,'pointermove','touch');ptr(100,360,'pointerup','touch');await wait(200);let m1=w.MementoStartVFX.getMetrics();check('single touch impulse',m1.impulses===m0.impulses+1);ptr(60,350,'pointerdown','touch');ptr(60,350,'pointercancel','touch');await wait(200);check('cancel no impulse',w.MementoStartVFX.getMetrics().impulses===m1.impulses);d.querySelector('[data-policy="privacy"]').click();check('privacy dialog opens',d.querySelector('dialog').open);d.querySelector('#mm-dialog-close').click();d.querySelector('[data-policy="cookies"]').click();check('cookie dialog opens',d.querySelector('dialog').open);d.querySelector('#mm-dialog-close').click();let qs=[...d.querySelectorAll('summary')];if(!qs[2].parentElement.open)qs[2].click();check('FAQ exclusive',d.querySelectorAll('details[open]').length===1&&qs[2].parentElement.open);qs[1].click();check('FAQ switches exclusively',d.querySelectorAll('details[open]').length===1&&qs[1].parentElement.open);await frames();check('official CTA',d.querySelector('#mm-explore').href==='https://mementostudio.it/#start'&&d.querySelector('#mm-explore').target==='_top');scroll(450);await frames();const masks=()=>[...d.querySelectorAll('.vfx-reveal')].filter(e=>{const r=e.getBoundingClientRect();return r.bottom>0&&r.top<w.innerHeight}).map(e=>{const mask=e.style.maskImage;const id=mask.match(/#([^"\)]+)/)?.[1];return [e.id,mask,id?d.getElementById(id)?.innerHTML:''].join('|')}).join('');let a=masks();scroll(700);await frames();scroll(450);await frames();check('scroll masks reversible',a===masks());results.textContent=JSON.stringify({checks,metrics:w.MementoStartVFX.getMetrics()},null,2);window.qaResult=checks;};
</script>
