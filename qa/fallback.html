<!doctype html><meta charset="utf-8"><title>Start V10 fallback QA</title><button id="run">Check fallback and lifecycle</button><pre id="result">Ready</pre><iframe id="app" style="width:390px;height:844px;border:0"></iframe><script>
const app=document.querySelector('#app'),result=document.querySelector('#result'),checks=[];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function load(mode){let html=await(await fetch('/index.html')).text();let override=mode==='reduced'?`const original=window.matchMedia.bind(window);window.matchMedia=q=>q.includes('prefers-reduced-motion')?{matches:true,media:q,addEventListener(){},removeEventListener(){}}:original(q);`:mode==='failed'?`const original=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(t,...a){return this.classList.contains('memento-vfx-canvas')?null:original.call(this,t,...a)};`:'';const ready=new Promise(r=>app.onload=r);app.srcdoc=html.replace('<head>','<head><base href="/"><script>'+override+'<\/script>');await ready;await wait(1200);return [app.contentWindow,app.contentDocument];}
run.onclick=async()=>{checks.length=0;result.textContent='Running…';let [w,d]=await load('reduced');checks.push({name:'reduced motion readable and stationary',pass:w.MementoStartVFX.getMetrics().frames===0&&!d.documentElement.classList.contains('vfx-boot')&&[...d.querySelectorAll('.vfx-reveal')].every(e=>!e.style.maskImage)});[w,d]=await load('failed');checks.push({name:'renderer unavailable readable',pass:!d.documentElement.classList.contains('vfx-boot')&&[...d.querySelectorAll('.vfx-reveal')].every(e=>!e.style.maskImage)&&d.querySelector('.hero-title').textContent.trim().length>0});[w,d]=await load('');const c=d.querySelector('.email-card');c.focus({preventScroll:true});w.scrollTo({top:c.offsetTop-10,behavior:'instant'});await wait(1600);checks.push({name:'focused content unmasked',pass:!c.style.maskImage});w.MementoStartVFX.setEnabled(false);checks.push({name:'disabled FX readable',pass:!d.documentElement.classList.contains('vfx-boot')&&!d.documentElement.classList.contains('vfx-ready')&&[...d.querySelectorAll('.vfx-reveal')].every(e=>!e.style.maskImage)});w.MementoStartVFX.dispose();checks.push({name:'dispose clears decorative state',pass:d.querySelectorAll('.memento-vfx-canvas,mask,.vfx-glyph,.vfx-icon').length===0});result.textContent=JSON.stringify(checks,null,2);};
</script>
