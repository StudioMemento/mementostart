<!doctype html><html lang="it"><meta charset="utf-8"><title>Start V27 — verifiche locali</title>
<style>body{background:#202124;color:#f3f3f3;font:14px system-ui;margin:20px}button{padding:10px 18px;margin:0 8px 12px 0}iframe{flex:none;display:block;background:#000;border:1px solid #666;width:390px;height:844px}pre{white-space:pre-wrap}section{display:flex;gap:24px;align-items:flex-start}aside{max-width:470px}</style>
<h1>Start V27 — verifiche locali</h1>
<button data-width="320" data-height="700">Mobile 320 × 700</button><button data-width="390" data-height="844">Mobile 390 × 844</button><button data-width="360" data-height="740">Mobile 360 × 740</button><button data-width="768" data-height="1024">Tablet 768 × 1024</button><button data-width="1280" data-height="900">Desktop 1280 × 900</button><a href="/qa-embed.html">Verifica embed Framer</a> <button id="embed">Embed nella viewport selezionata</button><button id="run">Verifica navigazione</button>
<section><iframe title="Anteprima responsive Start" src="/"></iframe><aside><pre id="report">Pronto. Il test usa la pagina reale.</pre></aside></section>
<script type="module">
const frame=document.querySelector('iframe'), out=document.querySelector('#report');
for(const b of document.querySelectorAll('[data-width]'))b.onclick=()=>{frame.style.width=b.dataset.width+'px';frame.style.height=b.dataset.height+'px';out.textContent='Pronto: '+b.textContent};
document.querySelector('#embed').onclick=()=>{frame.src='/qa-embed.html';out.textContent='Usa Verifica embed dentro la viewport.'};
let initialNav=null;
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=w.document,nav=d.querySelector('memento-nav');const dock=nav?.shadowRoot?.querySelector('.mm-dock');if(dock){const r=dock.getBoundingClientRect();initialNav={top:r.top,bottom:r.bottom,height:w.innerHeight,scroll:w.scrollY,connected:nav.parentElement===d.body};}});
const next=()=>new Promise(r=>setTimeout(r,100));
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;
 const w=frame.contentWindow,d=w.document, lines=[];
 out.textContent='Caricamento della pagina…';
 for(let n=0;n<100&&!d.querySelector('#question-idea');n++)await new Promise(r=>setTimeout(r,100));
 await d.fonts.ready;
 if(!d.querySelector('#question-idea')){out.textContent='FAIL — pagina non pronta';document.querySelector('#run').disabled=false;return}
 const check=(v,label)=>{lines.push(`${v?'PASS':'FAIL'} — ${label}`);out.textContent=lines.join('\n')};
 check(w.innerWidth===Number.parseInt(frame.style.width||'390'),'Viewport effettiva uguale alla larghezza selezionata: '+w.innerWidth+' px');
 const originalY=w.scrollY;
 w.scrollTo({top:0,behavior:'instant'});await next();
 const navHost=d.querySelector('memento-nav'),dock=navHost.shadowRoot.querySelector('.mm-dock');
 const rect=dock.getBoundingClientRect();
 const both=()=>['.mm-wordmark','.mm-dock'].every(selector=>{const r=navHost.shadowRoot.querySelector(selector).getBoundingClientRect();return r.top>=0&&r.bottom<=w.innerHeight&&r.width>0&&r.height>0});
 check(both(),'Logo e navbar visibili insieme in alto');
 check(rect.top>=0&&rect.bottom<=w.innerHeight&&navHost.parentElement===d.body,'Navbar visibile prima di scorrere');
 check(!initialNav||initialNav.top>=0&&initialNav.bottom<=initialNav.height&&initialNav.scroll===0,'Navbar nella viewport al caricamento iniziale');
 const isTouch=w.matchMedia('(hover: none), (pointer: coarse), (max-width: 767px)').matches;
 if(isTouch)check([...d.querySelectorAll('.contact-section a>img,.location-photo')].every(e=>w.getComputedStyle(e).filter==='none'),'Immagini a colori senza hover');
 else lines.push('INFO — browser con mouse: controllo CSS mobile coperto dal preset e shader; verifica fisica touch ancora necessaria');
 const px=20,py=w.innerHeight-140;
 const event=type=>new w.PointerEvent(type,{pointerType:'touch',pointerId:7,clientX:px,clientY:py,bubbles:true,cancelable:true});
 let titleReacted=false;const watch=new w.MutationObserver(()=>{if(d.querySelector('#start-title')?.classList.contains('touch-lit'))titleReacted=true});watch.observe(d.querySelector('#start-title'),{attributes:true});
 const down=event('pointerdown');d.body.dispatchEvent(down);
 check(!down.defaultPrevented&&d.querySelectorAll('.touch-ripple,.touch-feedback').length===0,'Touch senza cerchio o layer aggiunto, evento non bloccato');
 d.body.dispatchEvent(event('pointercancel'));d.body.dispatchEvent(event('pointerup'));
 check(d.querySelectorAll('.touch-ripple,.touch-feedback').length===0,'Nessun cerchio dopo rilascio/cancellazione');
 await new Promise(r=>setTimeout(r,1250));watch.disconnect();
 if(!w.__vfx){check(titleReacted,'Reazione raggiunge il titolo distante nel fallback');check(!d.querySelector('#start-title').classList.contains('touch-lit'),'Il titolo si spegne dopo il passaggio');}
 w.scrollTo({top:120,behavior:'instant'});await next();check(w.scrollY>100,'Scroll nativo disponibile durante il feedback');
 w.scrollTo({top:0,behavior:'instant'});await next();
 check(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'Nessun overflow orizzontale');
 const phone=d.querySelector('[data-phone-label]'),range=d.createRange();range.selectNodeContents(phone);
 const phoneRect=range.getBoundingClientRect(),phoneBox=phone.getBoundingClientRect(),card=phone.closest('a').getBoundingClientRect();
 check(phone.textContent==='328 545 4661'&&phone.closest('a').getAttribute('href')==='tel:+393285454661','Numero visibile senza prefisso; collegamento telefonico internazionale');
 check(range.getClientRects().length===1&&phoneRect.right<=card.right-12&&phoneRect.width<=phoneBox.width+1,'Numero intero su una riga, senza uscire dalla card');
 const hours=d.querySelector('.hours'),term=hours.querySelector('dt'),time=hours.querySelector('dd'),city=d.querySelector('.location-address span');
 check(term.getBoundingClientRect().top>=time.getBoundingClientRect().bottom,'Giorni della settimana sotto 14:00 — 18:00');
 const hr=term.getBoundingClientRect(),cr=city.getBoundingClientRect(),hc=hours.closest('.location-card').getBoundingClientRect(),ac=city.closest('.location-card').getBoundingClientRect();
 check(Math.abs((hc.bottom-hr.bottom)-(ac.bottom-cr.bottom))<=1&&w.getComputedStyle(term).fontSize===w.getComputedStyle(city).fontSize,'Riga secondaria di orari e indirizzo allineata al bordo inferiore');
 w.scrollTo({top:d.documentElement.scrollHeight/2,behavior:'instant'});await next();check(both(),'Logo e navbar visibili insieme a metà pagina');
 w.scrollTo({top:0,behavior:'instant'});await next();
 check([...d.querySelectorAll('a[href^="mailto:"],a[href^="tel:"],a[href*="wa.me"]')].length>=5,'Collegamenti di contatto presenti');
 for(const id of ['existing','time','commit','idea']){
  d.querySelector('#question-'+id).click();await next();
  check(d.querySelectorAll('details[open]').length===1 && d.querySelector('#question-'+id).parentElement.open,'FAQ '+id+': una sola risposta aperta');
 }
 d.querySelector('#question-idea').click();await next();check(d.querySelectorAll('details[open]').length===0,'FAQ richiudibile');
 d.querySelector('#question-idea').click();await next();
 const prefs=[...d.querySelectorAll('button')].find(e=>e.textContent.includes('Preferenze cookie'));prefs.focus({preventScroll:true});prefs.click();await next();
 check(d.querySelector('dialog').open,'Dialog aperto');
 const checkbox=d.querySelector('input[type=checkbox]');checkbox.click();await next();check(!d.querySelector('#mm-map-area iframe'),'Mappa disattivabile');
 checkbox.click();await next();check(!!d.querySelector('#mm-map-area iframe'),'Mappa ripristinabile');
 d.querySelector('.dialog-close').click();await next();check(!d.querySelector('dialog').open&&!d.body.classList.contains('modal-open'),'Chiusura dialog sblocca scroll');
 check(d.activeElement===prefs,'Focus ritorna al controllo di apertura');
 const nav=d.querySelector('memento-nav').shadowRoot;
 check(nav.querySelectorAll('.mm-link').length===5 && nav.querySelector('[aria-current="page"]').dataset.id==='start','Navbar: cinque sezioni e Start attivo');
 w.scrollTo({top:d.documentElement.scrollHeight,behavior:'instant'});await next();check(w.scrollY>100,'Scroll nativo raggiunge fondo pagina');
 check(both(),'Logo e navbar visibili insieme a fondo pagina');
 if(w.__vfx){
  const before={...w.__vfx.metrics};frame.style.height=(frame.clientHeight-72)+'px';await next();await new Promise(r=>setTimeout(r,200));
  check(w.__vfx.metrics.rasterizations===before.rasterizations,'Variazione sola altezza: zero rasterizzazioni');
  out.textContent+='\nMetriche VFX: '+JSON.stringify(w.__vfx.metrics);
 }else lines.push('NON VERIFICABILE: WebGL non disponibile in questo browser. Resa GPU e FPS da verificare su dispositivo reale.');
 w.scrollTo({top:originalY,behavior:'instant'});
 await new Promise(r=>setTimeout(r,500));
 check(d.querySelectorAll('.touch-ripple').length===0,'Elementi dell’impulso rimossi al termine');
 document.querySelector('#run').disabled=false;
};
</script></html>
