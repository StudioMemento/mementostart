<!doctype html><meta charset="utf-8"><title>Start V11 — QA</title>
<style>*{box-sizing:border-box}body{margin:0;background:#222;color:#eee;font:12px monospace}#bar{position:fixed;bottom:0;left:0;z-index:5;background:#111e;padding:8px;max-height:120px;overflow:auto;width:100%}button{padding:6px;margin-right:8px}iframe{border:0;width:100%;height:100vh;display:block;margin:auto}body.mobile iframe{width:390px;height:844px}#result{white-space:pre-wrap}</style>
<iframe id="app" src="../../../index.html"></iframe>
<div id="bar"><button id="suite">Run suite</button><button id="hero">Typo</button><button id="card">Card center</button><button id="edge">Card edge</button><button id="scroll">Reveal</button><button id="mobile">Mobile</button><output id="result">Loading</output></div>
<script>
const app=document.querySelector('#app'),out=document.querySelector('#result'),sleep=ms=>new Promise(r=>setTimeout(r,ms));let w,d,fx;let results=[];
const check=(name,value,detail)=>{results.push({name,pass:!!value,detail});if(!value)throw Error(name+': '+JSON.stringify(detail));};
function move(x,y,type='mouse',kind='pointermove'){const el=d.elementFromPoint(x,y)||d.body;el.dispatchEvent(new w.PointerEvent(kind,{clientX:x,clientY:y,pointerId:1,pointerType:type,isPrimary:true,bubbles:true}));}
const rect=el=>el.getBoundingClientRect();
async function frames(n=2){const start=fx.getMetrics().frames;for(let i=0;i<80;i++){await sleep(100);if(fx.getMetrics().frames>=start+n)return;}}
async function pos(y){w.scrollTo({top:y,behavior:'instant'});await frames(2);}
function paths(){return [...d.querySelectorAll('.vfx-reveal')].filter(t=>t.style.maskImage).map(t=>({id:t.dataset.vfxSurface,d:d.getElementById('vfx-mask-'+t.dataset.vfxSurface)?.querySelector('path')?.getAttribute('d')}));}
function amberAt(x,y,size=50){const c=d.querySelector('.memento-vfx-foreground'),r=rect(c),sx=c.width/r.width,sy=c.height/r.height;const a=c.getContext('2d').getImageData(Math.max(0,Math.round((x-size/2)*sx)),Math.max(0,Math.round((y-size/2)*sy)),Math.round(size*sx),Math.round(size*sy)).data;let count=0;for(let i=0;i<a.length;i+=4)if(a[i]>a[i+2]*1.3&&a[i+3]>12)count++;return count;}
async function scenario(which){
 document.body.classList.toggle('mobile',which==='mobile');await sleep(200);
 if(which==='hero'){await pos(0);const r=rect(d.querySelectorAll('.hero-line')[1]);move(r.x+r.width*.38,r.y+r.height*.5);}
 else{const el=d.querySelector('#mm-email-studio');await pos(rect(el).top+w.scrollY-280);const r=rect(el);move(r.x+r.width*(which==='edge'?.95:.6),r.y+r.height*.55);if(which==='scroll')await pos(w.scrollY+185);if(which==='mobile'){await pos(rect(el).top+w.scrollY-210);const r=rect(el);move(r.x+r.width*.55,r.y+r.height*.5,'touch','pointerdown');}}
 await frames(3);await sleep(300);out.textContent=which+' | '+JSON.stringify(fx.getMetrics());
}
app.onload=async()=>{w=app.contentWindow;d=w.document;await sleep(2400);fx=w.MementoStartVFX;out.textContent='Ready';};
for(const id of ['hero','card','edge','scroll','mobile'])document.querySelector('#'+id).onclick=()=>scenario(id);
document.querySelector('#suite').onclick=async()=>{results=[];try{
 document.body.classList.remove('mobile');await sleep(200);await pos(0);await sleep(1800);
 let m=fx.getMetrics();check('engine healthy',m.error===null,m);check('canvas matches CSS width',m.logicalWidth===d.documentElement.clientWidth&&m.canvasCSSWidth===m.logicalWidth,{inner:w.innerWidth,client:d.documentElement.clientWidth,logical:m.logicalWidth});
 const title=d.querySelectorAll('.hero-line')[1],tr=rect(title);move(tr.x+tr.width*.4,tr.y+tr.height*.5);await sleep(650);check('typography energy',parseFloat(title.style.getPropertyValue('--vfx-text-alpha'))>.6,title.style.getPropertyValue('--vfx-text-alpha'));
 await scenario('card');const card=d.querySelector('#mm-email-studio'),cr=rect(card);const x=cr.x+cr.width*.6,y=cr.y+cr.height*.55;check('center mesh visible',amberAt(x,y)>12,amberAt(x,y));check('active base saturation',card.style.getPropertyValue('--vfx-image')==='.8',card.style.getPropertyValue('--vfx-image'));check('full color local layer',card.querySelector('.vfx-color-pass').style.getPropertyValue('--vfx-color-on')==='1');
 const idle=d.querySelector('#mm-email-project');check('adjacent image remains neutral',idle.style.getPropertyValue('--vfx-image')!=='1'&&idle.style.getPropertyValue('--vfx-image')!=='.8');
 d.documentElement.dispatchEvent(new w.PointerEvent('pointerleave',{bubbles:false}));await sleep(1200);
 const base=w.scrollY;const maps=[];
 for(const y of [base+100,base+185,base+260]){await pos(y);maps.push({y,paths:paths()});}
 await frames(3);const frozen=paths();await frames(3);check('scroll masks freeze',JSON.stringify(frozen)===JSON.stringify(paths()));
 for(const sample of maps.toReversed()){await pos(sample.y);check('same cells on reverse '+sample.y,JSON.stringify(sample.paths)===JSON.stringify(paths()));}
 check('intermediate reveal cells',fx.inspect().targets.some(t=>t.masked&&t.coverage.some(v=>v>0&&v<1)));
 document.body.classList.add('mobile');await sleep(600);await pos(0);m=fx.getMetrics();check('mobile canvas width',m.logicalWidth===390&&m.canvasCSSWidth===390,m.logicalWidth);check('no horizontal overflow',d.documentElement.scrollWidth===390,d.documentElement.scrollWidth);
 let before=fx.getMetrics();move(210,310,'touch','pointerdown');move(230,330,'touch');move(230,330,'touch','pointerup');await sleep(300);m=fx.getMetrics();check('one release impulse',m.impulses===before.impulses+1,{before:before.impulses,after:m.impulses});
 before=m;move(210,310,'touch','pointerdown');move(210,310,'touch','pointercancel');await sleep(200);m=fx.getMetrics();check('cancel has no pulse',m.pointerCancels===before.pointerCancels+1&&m.impulses===before.impulses);
 const faq=d.querySelector('.faq-panel');await pos(rect(faq).top+w.scrollY-200);const fr=rect(faq);move(fr.x+fr.width*.7,fr.y+fr.height*.3);await frames(2);
 const originals=[...d.querySelectorAll('.faq-photo:not(.vfx-color-pass)')],clones=[...d.querySelectorAll('.vfx-color-pass.faq-photo')];
 for(let i=0;i<60;i++){if(clones.some(c=>parseFloat(w.getComputedStyle(c).opacity)>.24))break;await sleep(100);}
 check('FAQ only selected color image',clones.filter(c=>parseFloat(w.getComputedStyle(c).opacity)>.01).length===1,clones.map(c=>w.getComputedStyle(c).opacity));
 check('FAQ mobile opacity preserved',Math.abs(parseFloat(w.getComputedStyle(clones.find(c=>c.classList.contains('is-active'))).opacity)-.25)<.01);
 d.querySelector('#question-existing').click();await frames(2);await sleep(800);check('FAQ color follows selection',clones.filter(c=>parseFloat(w.getComputedStyle(c).opacity)>.01).length===1&&clones.find(c=>c.classList.contains('is-active')).dataset.faqImage===originals.find(c=>c.classList.contains('is-active')).dataset.faqImage);
 fx.setEnabled(false);check('fallback clears masks',!d.documentElement.classList.contains('vfx-ready')&&[...d.querySelectorAll('.vfx-reveal')].every(t=>!t.style.maskImage));fx.setEnabled(true);await sleep(700);check('restart healthy',fx.getMetrics().error===null&&fx.getMetrics().enabled);
 document.body.classList.remove('mobile');await sleep(500);await scenario('hero');check('one engine two canvases',d.querySelectorAll('.memento-vfx-canvas').length===2);
 out.textContent=JSON.stringify({status:'PASS',results,metrics:fx.getMetrics()},null,2);
 }catch(e){out.textContent=JSON.stringify({status:'FAIL',error:String(e),results},null,2);}}
</script>
